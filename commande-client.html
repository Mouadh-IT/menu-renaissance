<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Commander · La Renaissance</title>
<meta name="theme-color" content="#0B0906">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="La Renaissance">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0906;--card:#15100A;--ink:#F2EAD9;--muted:#9C8D77;
  --gold:#C9A24B;--gold-lt:#EBCE85;--gold-dk:#7E6023;
  --wine:#D96A78;--wine-dk:#8E2B3A;
  --ok:#5FA871;--line:rgba(201,162,75,.18);
  --ease:cubic-bezier(.16,1,.3,1);
  --bot:calc(84px + env(safe-area-inset-bottom));
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:'Jost',sans-serif;font-weight:300;line-height:1.5;
  overflow-x:hidden;-webkit-font-smoothing:antialiased;padding-bottom:var(--bot)}
body.lock{overflow:hidden}
img{display:block;max-width:100%}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:6px}
.hide{display:none!important}

/* ---------- EN-TÊTE ---------- */
header{position:sticky;top:0;z-index:30;background:rgba(9,7,5,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.hb{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px clamp(14px,4vw,22px)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mono{display:grid;place-items:center;width:32px;height:32px;border:1px solid var(--gold);border-radius:50%;
  font-family:'Cinzel',serif;font-size:11px;color:var(--gold);flex:none}
.bn{font-family:'Cinzel',serif;letter-spacing:.14em;font-size:12.5px;color:var(--gold-lt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbl{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:30px;padding:6px 13px;font-size:12px;
  letter-spacing:.08em;color:var(--muted);white-space:nowrap;background:var(--card)}
.tbl b{color:var(--gold-lt);font-weight:400}

/* onglets catégories */
.cats{display:flex;gap:6px;overflow-x:auto;padding:0 clamp(14px,4vw,22px) 10px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats button{flex:none;font-size:12px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);
  padding:8px 14px;border-radius:30px;border:1px solid transparent;transition:.28s var(--ease);white-space:nowrap}
.cats button.on{color:#241a06;background:linear-gradient(175deg,var(--gold-lt),var(--gold));font-weight:400}
.cats button:not(.on):hover{border-color:var(--line);color:var(--ink)}

/* ---------- SECTIONS ---------- */
main{padding:clamp(18px,4vw,30px) clamp(14px,4vw,22px) 30px;max-width:900px;margin:0 auto}
.sec{margin-bottom:38px;scroll-margin-top:104px}
.sh{display:flex;align-items:baseline;gap:13px;margin-bottom:16px}
.sh h2{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:clamp(25px,5vw,33px);line-height:1}
.sh i{flex:1;height:1px;background:linear-gradient(90deg,var(--gold-dk),transparent)}
.sh span{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}

/* plat avec photo */
.dish{display:grid;grid-template-columns:76px 1fr auto;gap:13px;align-items:center;padding:11px;
  background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:9px;transition:.28s var(--ease)}
.dish:hover{border-color:rgba(201,162,75,.4)}
.dish .ph{width:76px;height:76px;border-radius:10px;overflow:hidden;flex:none;position:relative}
.dish .ph img{width:100%;height:100%;object-fit:cover}
.dish .in{min-width:0}
.dish h3{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:19px;line-height:1.15;margin-bottom:3px}
.dish p{color:var(--muted);font-size:12.5px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dish .qy{display:inline-block;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--gold);margin-top:4px}
.rt{display:grid;justify-items:center;gap:7px}
.pz{font-family:'Cinzel',serif;color:var(--gold-lt);font-size:14.5px;white-space:nowrap}

/* boisson (ligne texte) */
.drink{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:11px 13px;
  border-bottom:1px solid rgba(201,162,75,.09)}
.drink:last-child{border-bottom:none}
.drink h3{font-size:15px;font-weight:400}
.drink small{color:var(--muted);font-size:11.5px;display:block;margin-top:1px}

/* bouton ajouter / stepper */
.add{width:34px;height:34px;border-radius:50%;border:1px solid var(--gold);color:var(--gold-lt);font-size:19px;
  display:grid;place-items:center;transition:.25s var(--ease);line-height:1}
.add:hover{background:var(--gold);color:#241a06}
.add:active{transform:scale(.9)}
.step{display:flex;align-items:center;gap:3px;background:#000;border:1px solid var(--gold);border-radius:30px;padding:2px}
.step button{width:29px;height:29px;border-radius:50%;color:var(--gold-lt);font-size:17px;display:grid;place-items:center;line-height:1}
.step button:hover{background:rgba(201,162,75,.16)}
.step b{min-width:19px;text-align:center;font-family:'Cinzel',serif;font-size:13.5px;color:var(--gold-lt);font-weight:400}

/* ---------- BARRE PANIER ---------- */
#bar{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:10px clamp(14px,4vw,22px) calc(10px + env(safe-area-inset-bottom));
  background:rgba(9,7,5,.95);backdrop-filter:blur(16px);border-top:1px solid var(--line);
  transform:translateY(115%);transition:transform .45s var(--ease)}
#bar.up{transform:none}
#bar button{width:100%;max-width:620px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:14px;
  background:linear-gradient(175deg,var(--gold-lt),var(--gold));color:#241a06;border-radius:14px;padding:14px 20px;
  font-family:'Cinzel',serif;font-size:14.5px;letter-spacing:.04em}
#bar .n{background:#241a06;color:var(--gold-lt);border-radius:30px;min-width:26px;height:26px;display:grid;place-items:center;
  font-size:12.5px;padding:0 8px}
#bar .l{display:flex;align-items:center;gap:11px}

/* ---------- PANIER (l'addition) ---------- */
#sheet{position:fixed;inset:0;z-index:60;background:rgba(6,4,3,.82);backdrop-filter:blur(10px);
  opacity:0;visibility:hidden;transition:.4s var(--ease);display:flex;align-items:flex-end;justify-content:center}
#sheet.open{opacity:1;visibility:visible}
.pane{width:min(560px,100%);max-height:92svh;display:flex;flex-direction:column;
  background:linear-gradient(168deg,#191308,#0C0906);border:1px solid var(--line);border-radius:22px 22px 0 0;
  transform:translateY(30px);transition:transform .5s var(--ease)}
#sheet.open .pane{transform:none}
.ph2{padding:20px 22px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:between;gap:12px}
.ph2 h2{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:26px;flex:1}
.close{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);color:var(--gold-lt);font-size:20px;display:grid;place-items:center;flex:none}
.body{overflow:auto;padding:16px 22px;flex:1}

/* lignes façon addition */
.li{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:11px 0}
.li+.li{border-top:1px dashed rgba(201,162,75,.16)}
.li .nm{font-size:15px}
.li .nm small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
.li .rr{display:flex;align-items:center;gap:12px}
.li .pp{font-family:'Cinzel',serif;color:var(--gold-lt);font-size:14px;min-width:62px;text-align:right}
.tot{border-top:1px solid var(--gold-dk);margin-top:12px;padding-top:15px;display:flex;align-items:baseline;justify-content:space-between}
.tot .lb{font-family:'Cinzel',serif;letter-spacing:.2em;font-size:12px;text-transform:uppercase;color:var(--muted)}
.tot .vv{font-family:'Cinzel',serif;font-size:27px;color:var(--gold-lt)}
.foot{padding:16px 22px calc(20px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.cta{width:100%;background:linear-gradient(175deg,var(--gold-lt),var(--gold));color:#241a06;border-radius:14px;padding:15px;
  font-family:'Cinzel',serif;font-size:15px;letter-spacing:.04em}
.cta:disabled{opacity:.4}
.ghost{width:100%;border:1px solid var(--gold);color:var(--gold-lt);border-radius:14px;padding:14px;margin-top:10px;
  font-family:'Cinzel',serif;font-size:14px}
.ghost:hover{background:rgba(201,162,75,.1)}
.empty{text-align:center;padding:44px 10px;color:var(--muted)}
.empty b{display:block;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:22px;color:var(--ink);margin-bottom:7px;font-weight:400}

/* choix paiement */
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:14px;
  padding:16px;margin-bottom:11px;transition:.25s var(--ease)}
.opt:hover{border-color:var(--gold)}
.opt.sel{border-color:var(--gold);background:rgba(201,162,75,.09)}
.opt .t{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:600;margin-bottom:4px}
.opt .d{color:var(--muted);font-size:12.5px}
.pays{display:flex;gap:8px;margin-top:13px;flex-wrap:wrap}
.pays span{border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-size:11.5px;color:var(--muted);letter-spacing:.04em}
#pel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;min-height:120px}
.perr{background:rgba(217,106,120,.1);border:1px solid rgba(217,106,120,.4);color:var(--wine);border-radius:11px;
  padding:12px 14px;font-size:13px;margin-bottom:12px;line-height:1.5}
.testcard{background:rgba(201,162,75,.08);border:1px solid var(--line);border-radius:11px;padding:11px 13px;
  font-size:12px;color:var(--muted);margin-bottom:13px;line-height:1.6}
.testcard b{color:var(--gold-lt);font-weight:400}
.demo{display:inline-block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--wine);
  border:1px solid rgba(217,106,120,.45);border-radius:20px;padding:4px 11px;margin-bottom:14px}

/* écran de paiement */
.pay{text-align:center;padding:36px 22px}
.spin{width:52px;height:52px;margin:0 auto 20px;border:2px solid rgba(201,162,75,.22);border-top-color:var(--gold);
  border-radius:50%;animation:sp .9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.pay h3{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:600;margin-bottom:7px}
.pay p{color:var(--muted);font-size:13.5px}

/* confirmation */
.done{text-align:center;padding:34px 22px}
.tick{width:64px;height:64px;margin:0 auto 18px;border-radius:50%;border:1.5px solid var(--ok);display:grid;place-items:center}
.tick svg{width:28px;height:28px;stroke:var(--ok);stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:40;stroke-dashoffset:40;animation:dr .6s .15s var(--ease) forwards}
@keyframes dr{to{stroke-dashoffset:0}}
.done .no{font-family:'Cinzel',serif;font-size:38px;color:var(--gold-lt);margin:6px 0 4px}
.done h3{font-family:'Cormorant Garamond',serif;font-size:25px;font-weight:600;margin-bottom:8px}
.done p{color:var(--muted);font-size:13.5px;max-width:38ch;margin:0 auto 6px}
.mailbox{margin-top:22px;border-top:1px solid var(--line);padding-top:20px;text-align:left}
.mailbox .lb2{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink);margin-bottom:4px}
.mailbox p{font-size:12.5px;color:var(--muted);margin-bottom:11px;line-height:1.5}
.mrow{display:flex;gap:8px}
.mrow input{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:11px;
  padding:13px 14px;color:var(--ink);font-family:inherit;font-size:15px}
.mrow input:focus{outline:none;border-color:var(--gold)}
.mrow button{border:1px solid var(--gold);background:rgba(201,162,75,.12);color:var(--gold-lt);border-radius:11px;
  padding:0 17px;font-family:'Cinzel',serif;font-size:13px;white-space:nowrap}
.mrow button:disabled{opacity:.4}
.msent{display:flex;align-items:center;gap:9px;background:rgba(95,168,113,.1);border:1px solid rgba(95,168,113,.35);
  border-radius:11px;padding:13px 15px;font-size:13.5px;color:#8FCB9E}
.msent b{font-weight:400;color:var(--ink)}
.done .pill{display:inline-block;margin-top:14px;border:1px solid var(--line);border-radius:30px;padding:8px 16px;
  font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(var(--bot) + 14px);transform:translate(-50%,18px);z-index:70;
  background:#000;border:1px solid var(--gold);border-radius:30px;padding:10px 20px;font-size:13px;color:var(--gold-lt);
  opacity:0;pointer-events:none;transition:.35s var(--ease);white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<header>
  <div class="hb">
    <div class="brand"><span class="mono">LR</span><span class="bn">La Renaissance</span></div>
    <button class="tbl" id="tb">Table <b id="tn">—</b></button>
  </div>
  <div class="cats" id="cats"></div>
</header>

<main id="main"></main>

<div id="bar"><button id="open">
  <span class="l"><span class="n" id="cn">0</span><span>Voir ma commande</span></span>
  <span id="ct">0,00 €</span>
</button></div>

<div id="sheet" role="dialog" aria-modal="true" aria-label="Ma commande">
  <div class="pane">
    <div class="ph2"><h2 id="pt">Ma commande</h2><button class="close" id="cl" aria-label="Fermer">&times;</button></div>
    <div class="body" id="pb"></div>
    <div class="foot" id="pf"></div>
  </div>
</div>

<div id="toast"></div>

/* Clé publique Stripe (Dashboard > Développeurs > Clés API).
   Laissez vide  -> paiement simulé (démo)
   pk_test_...   -> paiement réel en MODE TEST (carte 4242 4242 4242 4242)
   pk_live_...   -> production
   Cette clé est publique : elle ne permet aucun débit à elle seule. */
const STRIPE_PK = "";

const DB = (()=>{
  let sb=null, pret=false, onNew=null, onMaj=null;
  const dispo = ()=> !!(SUPA.url && SUPA.cle);

  /* --- repli démo : BroadcastChannel entre onglets --- */
  let chan=null;
  if(!dispo()){ try{ chan=new BroadcastChannel("lr-orders") }catch(e){} }

  async function init(){
    if(!dispo()) return false;
    const { createClient } = await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm");
    sb = createClient(SUPA.url, SUPA.cle);
    pret = true;
    return true;
  }

  return {
    dispo, chan,
    connecte:()=>pret,
    get client(){ return sb },
    init,

    /* Envoi d'une commande. Renvoie l'objet enregistré (avec son id). */
    async envoyer(o){
      if(!pret){ try{ chan&&chan.postMessage({type:"new",order:o}) }catch(e){} return o; }
      const { data, error } = await sb.from("commandes").insert({
        table_num:o.table, lignes:o.lignes, total:o.total, source:o.source||"client"
      }).select().single();
      if(error) throw error;
      return { ...o, id:data.id, num:data.numero };
    },

    /* Le client ajoute son e-mail après coup (fonction dédiée, sécurisée) */
    async email(id,adresse){
      if(!pret){ try{ chan&&chan.postMessage({type:"new",order:{...arguments[2],email:adresse}}) }catch(e){} return; }
      const { error } = await sb.rpc("ajouter_email",{ p_id:id, p_email:adresse });
      if(error) throw error;
    },

    /* Changement de statut (réservé au personnel connecté) */
    async statut(id,champs){
      if(!pret){ try{ chan&&chan.postMessage({type:"statut",...champs}) }catch(e){} return; }
      const { error } = await sb.from("commandes").update(champs).eq("id",id);
      if(error) throw error;
    },

    /* Commandes déjà en cours, au chargement de la tablette */
    async enCours(){
      if(!pret) return [];
      const { data, error } = await sb.from("service_en_cours").select("*");
      if(error) throw error;
      return data||[];
    },

    /* Abonnement temps réel : c'est ce qui fait vivre la tablette */
    ecouter(nouvelle, majour){
      onNew=nouvelle; onMaj=majour;
      if(!pret){
        if(chan) chan.onmessage=e=>{
          if(!e.data) return;
          if(e.data.type==="new")    onNew&&onNew(e.data.order);
          if(e.data.type==="statut") onMaj&&onMaj(e.data);
        };
        return;
      }
      sb.channel("service")
        .on("postgres_changes",{event:"INSERT",schema:"public",table:"commandes"},
            p=>onNew&&onNew(depuisBase(p.new)))
        .on("postgres_changes",{event:"UPDATE",schema:"public",table:"commandes"},
            p=>onMaj&&onMaj(depuisBase(p.new)))
        .subscribe();
    }
  };

  /* traduit une ligne de la base vers le format utilisé par l'interface */
  function depuisBase(r){
    return { id:r.id, num:r.numero, table:r.table_num, lignes:r.lignes,
             total:Number(r.total), paye:r.paye, mode:r.mode, statut:r.statut,
             email:r.email, source:r.source, ts:new Date(r.cree_le).getTime() };
  }
})();

/* ================= PAIEMENT STRIPE ================= */
let stripe=null, elements=null;
const stripeActif = ()=> !!(STRIPE_PK && SUPA.url);

async function chargerStripe(){
  if(stripe) return stripe;
  if(!window.Stripe){
    await new Promise((ok,ko)=>{
      const sc=document.createElement("script");
      sc.src="https://js.stripe.com/v3/"; sc.onload=ok; sc.onerror=()=>ko(new Error("Stripe injoignable"));
      document.head.appendChild(sc);
    });
  }
  stripe=Stripe(STRIPE_PK);
  return stripe;
}

/* Demande au serveur de préparer le paiement.
   Le montant est recalculé là-bas : ce que le navigateur envoie n'est pas cru. */
async function preparerPaiement(commandeId){
  const r=await fetch(`${SUPA.url}/functions/v1/creer-paiement`,{
    method:"POST",
    headers:{ "Content-Type":"application/json", Authorization:`Bearer ${SUPA.cle}` },
    body:JSON.stringify({ commande_id:commandeId })
  });
  const j=await r.json();
  if(!r.ok) throw new Error(j.error||"Préparation du paiement impossible");
  return j;
}

async function payerStripe(order){
  const s=await chargerStripe();
  const { client_secret }=await preparerPaiement(order.id);

  elements=s.elements({
    clientSecret:client_secret,
    appearance:{ theme:"night", variables:{
      colorPrimary:"#C9A24B", colorBackground:"#15100A", colorText:"#F2EAD9",
      colorDanger:"#D96A78", fontFamily:"Jost, sans-serif", borderRadius:"11px" }}
  });
  elements.create("payment",{layout:"tabs"}).mount("#pel");

  return new Promise((resolve,reject)=>{
    document.getElementById("payer").onclick=async ()=>{
      const b=document.getElementById("payer");
      b.disabled=true; b.textContent="Paiement en cours…";
      const { error }=await s.confirmPayment({ elements, redirect:"if_required" });
      if(error){
        document.getElementById("perr").innerHTML=`<div class="perr">${esc(error.message||"Paiement refusé")}</div>`;
        b.disabled=false; b.textContent="Payer "+eur(order.total);
        return;
      }
      resolve();   // le webhook côté serveur enverra la commande en cuisine
    };
    document.getElementById("pannuler").onclick=()=>reject(new Error("annule"));
  });
}

    lastOrder.email=v;
    (lastOrder.id ? DB.email(lastOrder.id,v)
                  : DB.envoyer({...lastOrder,email:v}))
      .catch(e=>console.warn(e));
    paintMail();
  };
  inp.addEventListener("keydown",e=>{if(e.key==="Enter")document.getElementById("emok").click()});
}

/* ============ ENVOI DE LA COMMANDE ============ */
let seq=Math.floor(Math.random()*40)+11;
function submit(){
  const lignes=Object.values(cart).map(l=>({n:l.item.n,q:l.qty,p:l.item.p}));
  const t=total();
  const order={num:++seq,table:table,lignes,total:t,
               paye:payMode==="ligne",mode:payMode,ts:Date.now(),
               statut:payMode==="ligne"?"nouvelle":"attente"};

  if(payMode==="ligne"){
    if(stripeActif()){
      (async ()=>{
        try{
          openSheet("processing");
          const enr=await DB.envoyer(order);
          order.id=enr.id; order.num=enr.num||order.num;
          openSheet("carte");
          await payerStripe(order);
          lastOrder=order; openSheet("done");
        }catch(e){
          if(e.message==="annule"){ openSheet("pay"); return; }
          toast(e.message||"Paiement impossible");
          openSheet("pay");
        }
      })();
    }else{
      openSheet("processing");
      // Paiement simulé (démo). Renseignez STRIPE_PK pour le paiement réel.
      setTimeout(()=>{ lastOrder=order; send(order); openSheet("done"); },1900);
    }
  }else{
    lastOrder=order; send(order); openSheet("done");
  }
}
async function send(o){
  try{ const r=await DB.envoyer(o); if(r&&r.id){o.id=r.id; o.num=r.num||o.num;} }
  catch(e){ console.warn("Envoi impossible :",e.message); toast("Connexion au service impossible"); }
}

paintCtl(); paintBar();
DB.init().then(r=>{ if(r) console.info("Connecté au service"); })
         .catch(e=>console.warn("Mode démo :",e.message));
</script>
